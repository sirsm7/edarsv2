<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDARS PPDAG - Log Masuk</title>
    
    <!-- Integrasi Favicon -->
    <link rel="icon" type="image/png" href="icoppdag.png">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ppdBlue: '#1e3a8a',
                        ppdAmber: '#fbbf24',
                        surface: 'var(--surface)',
                        card: 'var(--card)',
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Corak Latar Belakang Halus */
        .bg-pattern {
            background-color: var(--surface, #f8fafc);
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e2e8f0' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="header-banner text-white py-6 px-6 shadow-lg z-10">
        <div class="container mx-auto max-w-7xl flex flex-row items-center justify-center md:justify-start gap-5">
            <img src="icoppdag.png" alt="Logo PPD Alor Gajah" class="header-logo">
            <div class="flex flex-col">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight font-oswald uppercase drop-shadow-sm leading-none">
                    EDARS <span class="text-ppdAmber">PPD ALOR GAJAH</span>
                </h1>
                <p class="text-[10px] md:text-xs opacity-80 tracking-[0.15em] font-light uppercase mt-1">
                    Sistem Analisis & Pelaporan Data Peperiksaan Berpusat
                </p>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 relative">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-ppdBlue/10 rounded-full blur-3xl -z-10"></div>

        <section id="loginSection" class="bg-card/80 backdrop-blur-xl rounded-2xl shadow-2xl p-8 md:p-10 max-w-md w-full text-center border border-white/20 relative overflow-hidden animate-fade-in">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-ppdBlue to-ppdAmber"></div>
            
            <div class="mb-10">
                <div class="bg-blue-50 dark:bg-slate-800 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner border border-blue-100 dark:border-slate-700">
                    <span class="text-4xl">🔐</span>
                </div>
                <h2 class="text-3xl font-bold font-oswald uppercase tracking-wide">Gerbang Akses</h2>
                <p class="text-text-muted text-sm mt-2 font-medium">Sila pilih jenis pengguna untuk meneruskan</p>
            </div>

            <!-- Role Selection -->
            <div id="roleSelection" class="space-y-4">
                <button id="btnPublicLogin" class="group w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 font-oswald text-xl uppercase tracking-wider transform active:scale-95">
                    <span class="bg-white/20 p-1 rounded group-hover:rotate-12 transition-transform">👥</span> AKSES AWAM
                </button>
                
                <div class="relative flex py-4 items-center">
                    <div class="flex-grow border-t border-border"></div>
                    <span class="flex-shrink-0 mx-4 text-text-muted text-[10px] uppercase font-bold tracking-widest">Atau</span>
                    <div class="flex-grow border-t border-border"></div>
                </div>

                <button id="btnAdminMode" class="w-full bg-surface hover:bg-white text-text-muted hover:text-ppdBlue font-bold py-3.5 rounded-xl border border-border transition-all font-oswald uppercase tracking-wider text-sm shadow-sm">
                    AKSES PENTADBIR (PPD)
                </button>
            </div>

            <!-- Admin Login Form -->
            <form id="adminLoginForm" class="hidden mt-2 space-y-4" onsubmit="event.preventDefault()">
                <div class="text-left mb-4">
                    <button type="button" id="btnBackToRole" class="text-xs text-ppdBlue hover:underline font-bold uppercase tracking-wider flex items-center gap-1">
                        <span>‹</span> Kembali
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">✉️</div>
                        <input type="email" id="emailInput" placeholder="Emel Admin" value="sirsm@edidik.my"
                            class="w-full pl-12 pr-4 py-3.5 border border-border bg-surface rounded-xl focus:outline-none focus:ring-2 focus:ring-ppdBlue/50 text-center font-sans text-lg transition-all">
                    </div>
                    
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">🔑</div>
                        <input type="password" id="passwordInput" placeholder="Kata Laluan" 
                            class="w-full pl-12 pr-4 py-3.5 border border-border bg-surface rounded-xl focus:outline-none focus:ring-2 focus:ring-ppdBlue/50 text-center font-sans text-lg tracking-widest transition-all">
                    </div>
                </div>
                
                <button type="submit" id="btnAdminLogin" 
                    class="w-full bg-ppdBlue hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg font-oswald tracking-wider text-lg uppercase transition-all transform active:scale-95 mt-6">
                    MASUK SISTEM
                </button>
            </form>
        </section>
    </main>

    <footer class="text-center py-8 text-text-muted text-[10px] font-oswald uppercase tracking-[0.3em]">
        &copy; 2026 PPD Alor Gajah. Hak Cipta Terpelihara.
    </footer>

    <script type="module" src="js/login.js"></script>
</body>
</html>
